<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">

    <title>Bitcoin Kurs</title>

    <style>
        * {
            box-sizing: border-box;
        }

    body {
        margin: -10;
        min-height: 100vh;
        background: #000000;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 80px;
        }

        .bitcoin-display {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .title {
            color: #FFD700;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
                
        .currency {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .usd-label {
            color: #FFA500;
        }

        .eur-label {
            color: #3085ff;
        }

        .price {
            font-size: 52px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .usd-price {
            color: #FFA500;
        }

        .eur-price {
            color: #3085ff;
        }

        .info {
            color: #aaaaaa;
            font-size: 18px;
            line-height: 1.7;
            margin-top: 20px;
        }

        .countdown {
            color: #FFD700;
            font-size: 20px;
            font-weight: bold;
        }

        .error {
            color: #ff3030;
        }
    </style>
</head>

<body>

<div class="bitcoin-display">
    <div class="title">
        ₿ BITCOIN
    </div>

    <div class="currency usd-label">
        US - DOLLAR
    </div>

    <div class="price usd-price" id="usd">
        Wird geladen...
    </div>

    <div class="currency eur-label">
        EURO
    </div>

    <div class="price eur-price" id="eur">
        Wird geladen...
    </div>

    <div class="info">

        <div id="status">
            Bitcoin-Kurs wird abgerufen...
        </div>

        <div class="countdown" id="countdown">
            Nächste Aktualisierung: 02:00
        </div>

    </div>

</div>

<script>

const AKTUALISIERUNG = 2 * 60 * 1000;

let letzterKurs = null;
let letzteAktualisierung = null;
let naechsteAktualisierung = Date.now() + AKTUALISIERUNG;


/* =========================================
   Display wach halten
========================================= */

let wakeLock = null;

async function displayWachHalten() {

    try {

        if ("wakeLock" in navigator) {

            wakeLock = await navigator.wakeLock.request("screen");

            console.log("Display-Wachhalten aktiviert.");

        }

    } catch (fehler) {

        console.log(
            "Wake Lock konnte nicht aktiviert werden:",
            fehler
        );

    }

}


/* =========================================
   Wake Lock erneut aktivieren,
   wenn die Seite wieder sichtbar wird
========================================= */

document.addEventListener("visibilitychange", function() {

    if (document.visibilityState === "visible") {

        displayWachHalten();

    }

});


/* =========================================
   Bitcoin-Kurs laden
========================================= */

async function bitcoinKursLaden() {

    const status = document.getElementById("status");

    try {

        const antwort = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,eur"
        );

        if (!antwort.ok) {

            throw new Error(
                "Kurs konnte nicht geladen werden"
            );

        }

        const daten = await antwort.json();

        const usd = daten.bitcoin.usd;
        const eur = daten.bitcoin.eur;


        /* Kurs speichern */

        letzterKurs = {
            usd: usd,
            eur: eur
        };


        letzteAktualisierung = new Date();

        naechsteAktualisierung =
            Date.now() + AKTUALISIERUNG;


        /* Dollar */

        document.getElementById("usd").textContent =
            usd.toLocaleString("de-DE", {

                minimumFractionDigits: 2,
                maximumFractionDigits: 2

            }) + " $";


        /* Euro */

        document.getElementById("eur").textContent =
            eur.toLocaleString("de-DE", {

                minimumFractionDigits: 2,
                maximumFractionDigits: 2

            }) + " €";


        /* Status */

        status.className = "info";

        status.innerHTML =
            "Aktualisiert: " +
            letzteAktualisierung.toLocaleTimeString("de-DE");


        console.log(
            "Bitcoin-Kurs aktualisiert:",
            letzteAktualisierung.toLocaleTimeString("de-DE")
        );

    }


    catch (fehler) {

        console.error(fehler);


        /* Letzten erfolgreichen Kurs behalten */

        if (letzterKurs !== null) {

            status.className = "info error";

            status.innerHTML =
                "Verbindung momentan nicht verfügbar<br>" +
                "Letzter Kurs: " +
                letzteAktualisierung.toLocaleTimeString("de-DE");

        }

        else {

            status.className = "info error";

            status.textContent =
                "Bitcoin-Kurs konnte nicht geladen werden";

        }

    }

}


/* =========================================
   Countdown
========================================= */

function countdownAktualisieren() {

    const verbleibend =
        Math.max(
            0,
            naechsteAktualisierung - Date.now()
        );

    const sekunden =
        Math.ceil(verbleibend / 1000);

    const minuten =
        Math.floor(sekunden / 60);

    const restSekunden =
        sekunden % 60;

    const anzeige =
        String(minuten).padStart(2, "0") +
        ":" +
        String(restSekunden).padStart(2, "0");


    document.getElementById("countdown").textContent =
        "Nächste Aktualisierung: " + anzeige + " min.";

}


/* =========================================
   Start
========================================= */

displayWachHalten();

bitcoinKursLaden();

countdownAktualisieren();


/* Countdown jede Sekunde */

setInterval(function() {

    countdownAktualisieren();

}, 1000);


/* Bitcoin-Kurs alle 2 Minuten */

setInterval(function() {

    bitcoinKursLaden();

}, AKTUALISIERUNG);

</script>

</body>
</html>
